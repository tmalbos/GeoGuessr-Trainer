<div class="question" id="question-text"></div>

<div class="card-front" id="root">
  <div style="color:#aaa;font-size:13px;">Cargando...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

{{type:Answer}}

<script>
(function() {
  var questionDiv = document.getElementById('question-text');
  var questionRaw = "{{text:Question}}";
  questionDiv.textContent = questionRaw.replace(/\{[^{}]*\}/, "").trim();

  const YAML_RAW = `{{YamlData}}`;

  function cleanAnkiHtml(raw) {
    const txt = document.createElement('textarea');

    txt.innerHTML = raw
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<div>/gi, '\n')
      .replace(/<\/div>/gi, '')
      .replace(/<[^>]+>/g, '');

    return txt.value
      .replace(/\u00a0/g, ' ')
      .replace(/&nbsp;/g, ' ');
  }


  function getColorHex(color) {

    if (color === 'white')
      return '#F5F5F5';

    if (color === 'faded white')
      return '#B0B0B0';

    if (color === 'yellow')
      return '#FFD54F';

    if (color === 'orange-tinted yellow')
      return '#FFB300';

    if (color === 'green')
      return '#66BB6A';

    if (color === 'red')
      return '#EF5350';

    return '#F5F5F5';
  }


  function normalizeColor(c) {

    if (!c)
      return 'white';

    const u = c.toLowerCase().trim();

    if (u === 'white')
      return 'white';

    if (u === 'faded white')
      return 'faded white';

    if (u === 'yellow')
      return 'yellow';

    if (u === 'orange-tinted yellow')
      return 'orange-tinted yellow';

    if (u === 'green')
      return 'green';

    if (u === 'red')
      return 'red';

    return u;
  }


  function normalizePattern(p) {
    return (p || 'solid').toLowerCase().trim();
  }


  function getInnerPositions(innerCount, hasExtra) {

    const total =
      innerCount +
      (hasExtra ? 1 : 0);

    if (total === 1)
      return [50];

    if (total === 2)
      return [46, 54];

    if (total === 3)
      return [44, 50, 56];

    return [];
  }


  function normalizeRoad(r) {

    const inn = r.inner || {};

    const innerCount =
      inn.count || 0;

    return {

      outer: {
        count: r.outer?.count || 0,
        color: normalizeColor(r.outer?.color),
        pattern: normalizePattern(r.outer?.pattern)
      },

      inner:
        innerCount === 0
          ? null
          : {
              count: innerCount,
              color: normalizeColor(inn.color),
              pattern: normalizePattern(inn.pattern)
            },

      extra:
        r.extra
          ? {
              color: normalizeColor(r.extra.color),
              pattern: normalizePattern(r.extra.pattern)
            }
          : null,

      rule: (r.rule || '').trim()
    };
  }


  function getPatternBackground(pattern, color) {

    if (pattern === 'solid') {
      return color;
    }

    if (pattern === 'long-dashed') {
      return `repeating-linear-gradient(
        to bottom,
        ${color} 0px,
        ${color} 40px,
        transparent 40px,
        transparent 50px
      )`;
    }

    if (pattern === 'dashed') {
      return `repeating-linear-gradient(
        to bottom,
        ${color} 0px,
        ${color} 20px,
        transparent 20px,
        transparent 40px
      )`;
    }

    if (pattern === 'short-dashed') {
      return `repeating-linear-gradient(
        to bottom,
        ${color} 0px,
        ${color} 15px,
        transparent 15px,
        transparent 25px
      )`;
    }

    if (pattern === 'squares') {
      return `repeating-linear-gradient(
        to bottom,
        ${color} 0px,
        ${color} 6px,
        transparent 6px,
        transparent 12px
      )`;
    }

    return color;
  }


  function createLine(styles) {

    const line = document.createElement('div');

    line.className = 'line';

    Object.assign(line.style, styles);

    return line;
  }


  function renderRoad(road) {

    const roadContainer =
      document.createElement('div');

    roadContainer.className =
      'road-container';


    /*
      =========================
      ROAD PREVIEW
      =========================
    */

    const preview =
      document.createElement('div');

    preview.className =
      'preview-box';


    /*
      =========================
      OUTER
      =========================
    */

    const o = road.outer;

    if (o.count > 0) {

      const offsets =
        o.count === 1
          ? [6]
          : [4, 14];

      const background =
        getPatternBackground(
          o.pattern,
          getColorHex(o.color)
        );


      offsets.forEach(offset => {

        preview.appendChild(
          createLine({
            left: offset + 'px',
            background: background
          })
        );

      });


      [...offsets]
        .reverse()
        .forEach(offset => {

          preview.appendChild(
            createLine({
              right: offset + 'px',
              background: background
            })
          );

        });

    }


    /*
      =========================
      INNER + EXTRA
      =========================
    */

    const inn = road.inner;
    const ex = road.extra;


    /*
      Important:
      The original back only renders the
      inner/extra section when `inn` exists.
    */

    if (inn) {

      const hasExtra =
        ex !== null;


      const positions =
        getInnerPositions(
          inn.count,
          hasExtra
        );


      const total =
        inn.count +
        (hasExtra ? 1 : 0);


      positions.forEach((p, i) => {

        let cfg;


        if (total === 1) {

          cfg =
            inn.count === 1
              ? inn
              : ex;

        }

        else if (total === 2) {

          cfg =
            (inn.count === 1 && hasExtra)
              ? (i === 0 ? inn : ex)
              : inn;

        }

        else {

          cfg =
            (i === 1)
              ? ex
              : inn;

        }


        preview.appendChild(
          createLine({

            /*
              Same geometry as the original
              large preview.
            */

            left: (p - 2) + '%',

            background:
              getPatternBackground(
                cfg.pattern,
                getColorHex(cfg.color)
              )

          })
        );

      });

    }


    roadContainer.appendChild(preview);

    return roadContainer;
  }


  function render() {

    const root =
      document.getElementById('root');


    /*
      =========================
      PARSE YAML
      =========================
    */

    let data;

    try {

      data =
        jsyaml.load(
          cleanAnkiHtml(YAML_RAW)
        );

    }

    catch(e) {

      root.innerHTML =
        '<div style="' +
        'color:#F44336;' +
        'font-size:12px;' +
        'padding:10px;' +
        '">' +
        'Error parseando YAML: ' +
        e.message +
        '</div>';

      return;
    }


    /*
      =========================
      READ ROADS
      =========================

      Same source as the working card:

          data.roads.lines
    */

    let roads;

    try {

      roads =
        (data.roads?.lines || [])
          .map(normalizeRoad);

    }

    catch(e) {

      root.innerHTML =
        '<div style="' +
        'color:#F44336;' +
        'font-size:12px;' +
        'padding:10px;' +
        '">' +
        'Error leyendo rutas: ' +
        e.message +
        '</div>';

      return;
    }


    /*
      =========================
      RENDER
      =========================
    */

    root.innerHTML = '';


    if (roads.length === 0) {

      root.innerHTML =
        '<div style="' +
        'color:#aaa;' +
        'font-size:13px;' +
        'padding:15px;' +
        '">' +
        'No se encontraron rutas.' +
        '</div>';

      return;
    }


    roads.forEach(road => {

      root.appendChild(
        renderRoad(road)
      );

    });

  }


  render();

})();
</script>
